  <!-- Logica JavaScript completa -->
  <script>
    (function () {
      'use strict';

      /**

       */
      const CATEGORIES_DATA = [

            { name: 'FELPA SVEZIA, ROSSA', id: '1-drtLlEf8ZxcjpFg5uUDJ5fBTZhHE3e4' },

            { name: 'FELPA CON PATCH E ANGELI', id: '1rXUrxD5IxVodTuDE_SEaE5FA07RviuDY' },
            { name: 'FELPA CELINE', id: '1YaLFKFN61-fe6Wss_E_pzhA4SU8QdnlF' },
            { name: 'FELPA ERD', id: '1F-cOn4AvZFROHBgrze3wlWCTKs-rdn2k' },
            { name: 'MAGLIONE YSL', id: '1GbwDvXPpVe1hmELrz7Th0DSdnBqH4lvm' },
            { name: 'FELPA SUP X MM6', id: '15il_HaW3FtwlkoDqKFGzbZvo0oYQLNT8' },
            { name: 'FELPA CON DEMONI', id: '1s7hKjmxikW9Ppp-9lQ-p7DWfTg1ClKbe' },
            { name: 'FELPA CDG', id: '1cETvwC2cGyzZAP41-HEVbzCQktgtn17k' },
          ],
        },
        {

          label: 'Longsleeve',
          heightClass: 'h-[160px]',
          items: [
            { name: 'LONGSLEEVE EVISU', id: '1PdPrJPndA39P61YUbW9KX11hkbuJBz8E' },
            { name: 'LONGSLEEVE ACNE', id: '1RA0GZXbVfEBrVg1F27wICKxoqXXFKp06' },
            { name: 'LONGSLEEVE CON FIORI', id: '11S7nym6IiNQJLfgkgauAwYcjhSf7KGjz' },
          ],
        },
        {
          key: 'jeans',
          label: 'Jeans',
          heightClass: 'h-[190px]',
          items: [
            { name: 'JEANS BOOTCUT DENIM', id: '1uckbBLbJR5wVG9_RxBgOOlG8adeeWmco' },
            { name: 'JEANS BOOTCUT BIANCHI', id: '1aMYfBi-53x8KuM6ELKiAXv4tCad5XSbU' },
            { name: 'JEANS NERI PISTOLERI', id: '1KJ5jylS0mAdB0KWmI0E6oCKYCX4XvOJX' },
          ],
        },
        {
          key: 'scarpe',
          label: 'Scarpe',
          heightClass: 'h-[125px]',
          items: [
            { name: 'AIR MAX 95 NERE', id: '1rK2cBzXHgrvOiMZtuxE3KnnVzm4Z9F95' },
            { name: 'ASICS GEL NYC', id: '1XrNan__pjb0742JxiwMJo59qd6pwVdxm' },
            { name: 'GOLDEN GOOSE', id: '1mpnvq_Q-iv0IXlejPlR7TJtrJZHaBCxE' },
            { name: 'SAMBA', id: '1rmhVr_4INF2JDyDwGk7ygINkkJaybQx4' },
            { name: 'GATS OREO', id: '1SHnsawPq56sFGpcUJhirsjksOQ-k6RcV' },
            { name: 'NEW BALANCE 1906 NERE', id: '1o2m_JsCAmxvXsIK3MF4w_PCGAqnDkrQy' },
            { name: 'J5 A MA MANIERE', id: '1RiMdO5B1LZyVrD-4554tpHIxrbvNgt9R' },
            { name: 'TRAVIS OLIVE', id: '1_54nK87nRAu4Gg5W7nVpa2X6rzbWCXFS' },
            { name: 'GATS BLU', id: '1vPnazgIJK-cKoZslPbuycW7SIEKFlcLP' },
          ],
        },
      ];

      /**
       * Stato reattivo dell'applicazione per ogni categoria.
       */
      const state = {
        categories: CATEGORIES_DATA.map((cat) => ({
          ...cat,
          currentIndex: 0,
          hidden: false,
          locked: false,
          loadToken: 0,
        })),
        activeModalCatIndex: null,
        modalLoadToken: 0,
        toastTimer: null,
      };

      /**
       * Cache degli URL funzionanti per ogni ID Google Drive, così i cambi rapidi
       * e la modale riutilizzano subito l'endpoint già verificato.
       */
      const workingUrlCache = new Map();

      // Riferimenti DOM principali
      const slidersContainer = document.getElementById('slidersContainer');
      const outfitSummaryList = document.getElementById('outfitSummaryList');
      const visibleCountBadge = document.getElementById('visibleCountBadge');
      const showAllBtn = document.getElementById('showAllBtn');
      const copyOutfitBtn = document.getElementById('copyOutfitBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const shuffleIcon = document.getElementById('shuffleIcon');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const toastMessage = document.getElementById('toastMessage');

      // Riferimenti DOM Modale
      const quickViewModal = document.getElementById('quickViewModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const modalCategoryTitle = document.getElementById('modalCategoryTitle');
      const modalCounter = document.getElementById('modalCounter');
      const modalItemName = document.getElementById('modalItemName');
      const modalPreviewStage = document.getElementById('modalPreviewStage');
      const modalMainImg = document.getElementById('modalMainImg');
      const modalSpinner = document.getElementById('modalSpinner');
      const modalPrevBtn = document.getElementById('modalPrevBtn');
      const modalNextBtn = document.getElementById('modalNextBtn');
      const modalThumbnailsGrid = document.getElementById('modalThumbnailsGrid');

      /**
       * Genera la catena automatica di URL di Google Drive (primario + 2 fallback)
       * seguita da un placeholder finale di sicurezza se nessun endpoint risponde.
       */
      function buildDriveUrlChain(item) {
        const id = item.id;
        const safeLabel = encodeURIComponent(item.name);
        const chain = [
          `https://lh3.googleusercontent.com/d/${id}=w1000`,
          `https://drive.google.com/thumbnail?id=${id}&sz=w1000`,
          `https://drive.google.com/uc?export=view&id=${id}`,
          `https://placehold.co/500x500/2a2a31/d4d4d8?text=${safeLabel}`,
        ];

        // Se abbiamo già trovato un URL valido in cache, lo mettiamo in testa
        if (workingUrlCache.has(id)) {
          const cached = workingUrlCache.get(id);
          return [cached, ...chain.filter((u) => u !== cached)];
        }
        return chain;
      }

      /**
       * Carica un'immagine su un elemento <img> gestendo spinner, fallback a cascata
       * e protezione da race condition tramite token.
       */
      function loadImageWithFallback(imgEl, spinnerEl, item, getCurrentToken, expectedToken) {
        const urls = buildDriveUrlChain(item);
        let attempt = 0;

        imgEl.referrerPolicy = 'no-referrer';
        imgEl.alt = item.name;
        imgEl.classList.remove('opacity-100');
        imgEl.classList.add('opacity-0');

        if (spinnerEl) {
          spinnerEl.classList.remove('hidden');
        }

        const tryNextUrl = () => {
          if (getCurrentToken && getCurrentToken() !== expectedToken) return;
          if (attempt >= urls.length) {
            if (spinnerEl) spinnerEl.classList.add('hidden');
            return;
          }

          const currentUrl = urls[attempt];
          attempt += 1;

          imgEl.onload = () => {
            if (getCurrentToken && getCurrentToken() !== expectedToken) return;
            // Salva in cache solo se è uno degli URL reali di Google Drive (non il placeholder)
            if (!currentUrl.startsWith('https://placehold.co/')) {
              workingUrlCache.set(item.id, currentUrl);
            }
            if (spinnerEl) spinnerEl.classList.add('hidden');
            requestAnimationFrame(() => {
              imgEl.classList.remove('opacity-0');
              imgEl.classList.add('opacity-100');
            });
          };

          imgEl.onerror = () => {
            if (getCurrentToken && getCurrentToken() !== expectedToken) return;
            tryNextUrl();
          };

          imgEl.src = currentUrl;
        };

        tryNextUrl();
      }

      /**
       * Precarica silenziosamente il capo precedente e successivo di una categoria
       * per rendere lo scorrimento istantaneo.
       */
      function preloadAdjacentImages(catIndex) {
        try {
          const cat = state.categories[catIndex];
          if (!cat || cat.items.length <= 1) return;

          const total = cat.items.length;
          const prevItem = cat.items[(cat.currentIndex - 1 + total) % total];
          const nextItem = cat.items[(cat.currentIndex + 1) % total];

          [prevItem, nextItem].forEach((item) => {
            const preloadImg = new Image();
            preloadImg.referrerPolicy = 'no-referrer';
            const urls = buildDriveUrlChain(item);
            preloadImg.src = urls[0];
          });
        } catch (err) {
          // Ignora eventuali errori di precaricamento silenzioso
        }
      }

      /**
       * Mostra un breve messaggio toast non invasivo in basso.
       */
      function showToast(text) {
        if (state.toastTimer) clearTimeout(state.toastTimer);
        toastMessage.textContent = text;
        toastMessage.classList.remove('opacity-0', 'translate-y-2');
        toastMessage.classList.add('opacity-100', 'translate-y-0');

        state.toastTimer = setTimeout(() => {
          toastMessage.classList.remove('opacity-100', 'translate-y-0');
          toastMessage.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      }

      /**
       * Costruisce la struttura iniziale DOM delle 5 righe slider.
       */
      function buildSlidersDOM() {
        slidersContainer.innerHTML = '';

        state.categories.forEach((cat, catIndex) => {
          const hasMultiple = cat.items.length > 1;
          const card = document.createElement('article');
          card.id = `category-card-${catIndex}`;
          card.className =

                    hasMultiple
                      ? 'bg-zinc-100 dark:bg-zinc-800/90 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-90 cursor-pointer'

                  }"

                >

              <!-- Nome del capo selezionato + indicatori pallini -->

                  id="name-${catIndex}"

          // Collega gli event listener per la categoria
          attachCategoryEvents(catIndex);

      }

      /**
       * Collega frecce, swipe touch, click zoom, lucchetto e mostra/nascondi.
       */
      function attachCategoryEvents(catIndex) {
        const cat = state.categories[catIndex];
        const prevBtn = document.getElementById(`prev-btn-${catIndex}`);
        const nextBtn = document.getElementById(`next-btn-${catIndex}`);
        const stage = document.getElementById(`stage-${catIndex}`);
        const lockBtn = document.getElementById(`lock-btn-${catIndex}`);
        const hideBtn = document.getElementById(`hide-btn-${catIndex}`);
        const collapsedBar = document.getElementById(`collapsed-bar-${catIndex}`);
        const counterBtn = document.getElementById(`counter-btn-${catIndex}`);

        if (cat.items.length > 1) {
          prevBtn.addEventListener('click', () => stepCategory(catIndex, -1));
          nextBtn.addEventListener('click', () => stepCategory(catIndex, 1));
        }

        lockBtn.addEventListener('click', () => toggleLock(catIndex));
        hideBtn.addEventListener('click', () => toggleHidden(catIndex, true));
        collapsedBar.addEventListener('click', () => toggleHidden(catIndex, false));
        counterBtn.addEventListener('click', () => openQuickViewModal(catIndex));

        // Supporto swipe orizzontale su mobile e tap per aprire la vista rapida
        let touchStartX = 0;
        let touchStartY = 0;
        let didSwipe = false;

        stage.addEventListener(
          'touchstart',
          (e) => {
            if (!e.touches || e.touches.length !== 1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            didSwipe = false;
          },
          { passive: true }
        );

        stage.addEventListener(
          'touchend',
          (e) => {
            if (!e.changedTouches || e.changedTouches.length !== 1) return;
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;

            // Riconosce swipe solo se chiaramente orizzontale
            if (Math.abs(deltaX) > 36 && Math.abs(deltaX) > Math.abs(deltaY) * 1.15) {
              didSwipe = true;
              if (cat.items.length > 1) {
                stepCategory(catIndex, deltaX < 0 ? 1 : -1);
              }
            }
          },
          { passive: true }
        );

        stage.addEventListener('click', () => {
          if (didSwipe) {
            didSwipe = false;
            return;
          }
          openQuickViewModal(catIndex);
        });

        // Accessibilità da tastiera sullo slider focalizzato
        stage.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openQuickViewModal(catIndex);
          } else if (e.key === 'ArrowLeft' && cat.items.length > 1) {
            e.preventDefault();
            stepCategory(catIndex, -1);
          } else if (e.key === 'ArrowRight' && cat.items.length > 1) {
            e.preventDefault();
            stepCategory(catIndex, 1);
          }
        });
      }

      /**
       * Cambia il capo di una categoria di +1 o -1 con loop infinito e leggera transizione.
       */
      function stepCategory(catIndex, delta) {
        const cat = state.categories[catIndex];
        if (!cat || cat.items.length <= 1) return;

        const total = cat.items.length;
        const nextIndex = (cat.currentIndex + delta + total) % total;
        setCategoryItem(catIndex, nextIndex, delta > 0 ? 'next' : 'prev');
      }

      /**
       * Imposta direttamente un capo specifico per una categoria.
       */
      function setCategoryItem(catIndex, newIndex, direction = null) {
        const cat = state.categories[catIndex];
        if (!cat) return;

        cat.currentIndex = newIndex;
        renderCategoryContent(catIndex, direction);
        renderOutfitSummary();

        // Se la modale è aperta su questa categoria, sincronizzala
        if (state.activeModalCatIndex === catIndex) {
          renderModalContent();
        }
      }

      /**
       * Aggiorna immagine, nome, contatore e pallini di una singola categoria.
       */
      function renderCategoryContent(catIndex, direction = null) {
        const cat = state.categories[catIndex];
        const item = cat.items[cat.currentIndex];

        const imgEl = document.getElementById(`img-${catIndex}`);
        const spinnerEl = document.getElementById(`spinner-${catIndex}`);
        const nameEl = document.getElementById(`name-${catIndex}`);
        const counterBtn = document.getElementById(`counter-btn-${catIndex}`);
        const dotsContainer = document.getElementById(`dots-${catIndex}`);

        nameEl.textContent = item.name;
        counterBtn.textContent = `${cat.currentIndex + 1} / ${cat.items.length}`;

        // Breve animazione direzionale leggera al cambio capo
        if (direction) {
          const offsetClass = direction === 'next' ? 'translate-x-3' : '-translate-x-3';
          imgEl.classList.add(offsetClass);
          setTimeout(() => {
            imgEl.classList.remove('translate-x-3', '-translate-x-3');
          }, 160);
        }

        // Incrementa token anti-race condition e carica immagine con fallback Drive
        cat.loadToken += 1;
        const expectedToken = cat.loadToken;
        loadImageWithFallback(
          imgEl,
          spinnerEl,
          item,
          () => state.categories[catIndex].loadToken,
          expectedToken
        );

        // Aggiorna i pallini indicatori
        if (dotsContainer) {
          dotsContainer.innerHTML = '';
          cat.items.forEach((_, idx) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.ariaLabel = `Vai al capo ${idx + 1}`;
            const isActive = idx === cat.currentIndex;
            dot.className = isActive
              ? 'h-1.5 w-4 rounded-full bg-zinc-800 dark:bg-zinc-200 transition-all duration-200 cursor-pointer'
              : 'h-1.5 w-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-500 transition-all duration-200 cursor-pointer';
            dot.addEventListener('click', () => {
              if (idx !== cat.currentIndex) {
                setCategoryItem(catIndex, idx, idx > cat.currentIndex ? 'next' : 'prev');
              }
            });
            dotsContainer.appendChild(dot);
          });
        }

        // Precarica le foto adiacenti per uno scorrimento fluido
        preloadAdjacentImages(catIndex);
      }

      /**
       * Blocca o sblocca una categoria (escludendola dal tasto Casuale).
       */
      function toggleLock(catIndex) {
        const cat = state.categories[catIndex];
        cat.locked = !cat.locked;

        const lockBtn = document.getElementById(`lock-btn-${catIndex}`);
        const openIcon = document.getElementById(`lock-open-icon-${catIndex}`);
        const closedIcon = document.getElementById(`lock-closed-icon-${catIndex}`);

        if (cat.locked) {
          openIcon.classList.add('hidden');
          closedIcon.classList.remove('hidden');
          lockBtn.classList.remove(
            'text-zinc-400',
            'dark:text-zinc-500',
            'hover:text-zinc-700',
            'dark:hover:text-zinc-200'
          );
          lockBtn.classList.add(
            'text-amber-600',
            'dark:text-amber-400',
            'bg-amber-500/10'
          );
          lockBtn.title = 'Categoria bloccata (clicca per sbloccare)';
        } else {
          openIcon.classList.remove('hidden');
          closedIcon.classList.add('hidden');
          lockBtn.classList.remove(
            'text-amber-600',
            'dark:text-amber-400',
            'bg-amber-500/10'
          );
          lockBtn.classList.add(
            'text-zinc-400',
            'dark:text-zinc-500',
            'hover:text-zinc-700',
            'dark:hover:text-zinc-200'
          );
          lockBtn.title = 'Blocca categoria per il tasto Casuale';
        }
      }

      /**
       * Mostra o nasconde una categoria compattandola in una barra sottile.
       */
      function toggleHidden(catIndex, shouldHide) {
        const cat = state.categories[catIndex];
        cat.hidden = shouldHide;

        const collapsedBar = document.getElementById(`collapsed-bar-${catIndex}`);
        const expandedBody = document.getElementById(`expanded-body-${catIndex}`);

        if (cat.hidden) {
          expandedBody.classList.add('hidden');
          collapsedBar.classList.remove('hidden');
          collapsedBar.classList.add('flex');
        } else {
          collapsedBar.classList.add('hidden');
          collapsedBar.classList.remove('flex');
          expandedBody.classList.remove('hidden');
        }

        renderOutfitSummary();
      }

      /**
       * Genera un outfit casuale tra le categorie visibili e non bloccate.
       */
      function shuffleOutfit() {
        let changedCount = 0;

        // Piccola rotazione visiva dell'icona shuffle
        shuffleIcon.classList.add('rotate-180');
        setTimeout(() => shuffleIcon.classList.remove('rotate-180'), 320);

        state.categories.forEach((cat, catIndex) => {
          if (cat.hidden || cat.locked || cat.items.length <= 1) return;

          // Sceglie un indice diverso da quello attuale per un cambio sempre evidente
          let randomIdx = cat.currentIndex;
          while (randomIdx === cat.currentIndex) {
            randomIdx = Math.floor(Math.random() * cat.items.length);
          }

          setCategoryItem(catIndex, randomIdx, 'next');
          changedCount += 1;
        });

        if (changedCount === 0) {
          showToast('Sblocca o mostra almeno una categoria con più capi');
        }
      }

      /**
       * Aggiorna il pannello riepilogativo "Outfit attuale" in fondo alla pagina.
       */
      function renderOutfitSummary() {
        const visibleCats = state.categories.filter((c) => !c.hidden);
        const hiddenCount = state.categories.length - visibleCats.length;

        visibleCountBadge.textContent =
          visibleCats.length === 1 ? '1 capo' : `${visibleCats.length} capi`;

        if (hiddenCount > 0) {
          showAllBtn.classList.remove('hidden');
        } else {
          showAllBtn.classList.add('hidden');
        }

        outfitSummaryList.innerHTML = '';

        if (visibleCats.length === 0) {
          const emptyLi = document.createElement('li');
          emptyLi.className = 'text-xs text-zinc-400 dark:text-zinc-500 italic py-1';
          emptyLi.textContent = 'Nessuna categoria visibile. Clicca su una barra per riattivarla.';
          outfitSummaryList.appendChild(emptyLi);
          return;
        }

        visibleCats.forEach((cat) => {
          const currentItem = cat.items[cat.currentIndex];
          const li = document.createElement('li');
          li.className =
            'flex items-baseline justify-between gap-3 py-1 border-b last:border-b-0 border-zinc-100 dark:border-zinc-800/70';

          li.innerHTML = `
            <span class="text-[11px] uppercase tracking-[0.1em] text-zinc-400 dark:text-zinc-500 shrink-0">
              ${cat.label}
            </span>
            <span class="text-xs sm:text-sm font-medium text-zinc-800 dark:text-zinc-100 text-right truncate">
              ${currentItem.name}
            </span>
          `;
          outfitSummaryList.appendChild(li);
        });
      }

      /**
       * Copia il riepilogo dell'outfit negli appunti tramite execCommand (compatibile anche in iframe).
       */
      function copyOutfitToClipboard() {
        const visibleCats = state.categories.filter((c) => !c.hidden);
        if (visibleCats.length === 0) {
          showToast('Nessun capo attivo da copiare');
          return;
        }

        const lines = visibleCats.map(
          (cat) => `${cat.label}: ${cat.items[cat.currentIndex].name}`
        );
        const textToCopy = `Outfit attuale:\n${lines.join('\n')}`;

        try {
          const tempTextarea = document.createElement('textarea');
          tempTextarea.value = textToCopy;
          tempTextarea.setAttribute('readonly', '');
          tempTextarea.className = 'fixed -top-full left-0 opacity-0 pointer-events-none';
          document.body.appendChild(tempTextarea);
          tempTextarea.select();
          tempTextarea.setSelectionRange(0, tempTextarea.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(tempTextarea);

          if (ok) {
            showToast('Lista outfit copiata!');
          } else {
            showToast('Impossibile copiare automaticamente');
          }
        } catch (err) {
          showToast('Impossibile copiare automaticamente');
        }
      }

      /**
       * Apre la modale di Vista Rapida / Miniature per la categoria selezionata.
       */
      function openQuickViewModal(catIndex) {
        state.activeModalCatIndex = catIndex;
        quickViewModal.classList.remove('hidden');
        quickViewModal.classList.add('flex');
        document.body.classList.add('overflow-hidden');

        renderModalContent(true);
      }

      /**
       * Chiude la modale di Vista Rapida.
       */
      function closeQuickViewModal() {
        state.activeModalCatIndex = null;
        quickViewModal.classList.add('hidden');
        quickViewModal.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
      }

      /**
       * Aggiorna i contenuti della modale (foto grande, titolo e griglia miniature).
       */
      function renderModalContent(rebuildGrid = false) {
        const catIndex = state.activeModalCatIndex;
        if (catIndex === null) return;

        const cat = state.categories[catIndex];
        const item = cat.items[cat.currentIndex];
        const hasMultiple = cat.items.length > 1;

        modalCategoryTitle.textContent = cat.label;
        modalCounter.textContent = `${cat.currentIndex + 1} / ${cat.items.length}`;
        modalItemName.textContent = item.name;

        // Mostra o attenua frecce modale se c'è un solo capo
        [modalPrevBtn, modalNextBtn].forEach((btn) => {
          btn.disabled = !hasMultiple;
          if (hasMultiple) {
            btn.classList.remove('opacity-30', 'cursor-default');
            btn.classList.add('cursor-pointer');
          } else {
            btn.classList.add('opacity-30', 'cursor-default');
            btn.classList.remove('cursor-pointer');
          }
        });

        // Carica immagine ingrandita
        state.modalLoadToken += 1;
        const expectedToken = state.modalLoadToken;
        loadImageWithFallback(
          modalMainImg,
          modalSpinner,
          item,
          () => state.modalLoadToken,
          expectedToken
        );

        // Costruisce la griglia miniature all'apertura o aggiorna lo stato selezionato
        if (rebuildGrid) {
          modalThumbnailsGrid.innerHTML = '';

          cat.items.forEach((garment, idx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.thumbIdx = String(idx);
            btn.className =
              'group flex flex-col items-center rounded-xl p-1.5 bg-[#ececf0] dark:bg-[#2a2a31] border-2 transition-all cursor-pointer text-left';

            btn.innerHTML = `
              <div class="relative w-full aspect-square rounded-lg flex items-center justify-center overflow-hidden p-1">
                <div class="thumb-spinner absolute inset-0 flex items-center justify-center pointer-events-none">
                  <div class="w-4 h-4 rounded-full border-2 border-zinc-400/35 border-t-zinc-600 dark:border-zinc-500/35 dark:border-t-zinc-200 animate-spin"></div>
                </div>
                <img
                  src=""
                  alt="${garment.name}"
                  referrerpolicy="no-referrer"
                  loading="lazy"
                  class="max-w-full max-h-full w-auto h-auto object-contain opacity-0 transition-opacity duration-200"
                />
              </div>
              <span class="mt-1.5 text-[10px] leading-tight font-medium text-zinc-700 dark:text-zinc-200 text-center line-clamp-2 w-full px-0.5">
                ${garment.name}
              </span>
            `;

            const thumbImg = btn.querySelector('img');
            const thumbSpinner = btn.querySelector('.thumb-spinner');
            loadImageWithFallback(thumbImg, thumbSpinner, garment, null, null);

            btn.addEventListener('click', () => {
              setCategoryItem(catIndex, idx);
            });

            modalThumbnailsGrid.appendChild(btn);
          });
        }

        // Evidenzia la miniatura attiva
        const thumbButtons = modalThumbnailsGrid.querySelectorAll('button[data-thumb-idx]');
        thumbButtons.forEach((btn) => {
          const idx = Number(btn.dataset.thumbIdx);
          if (idx === cat.currentIndex) {
            btn.classList.remove('border-transparent', 'hover:border-zinc-400/50');
            btn.classList.add('border-zinc-900', 'dark:border-zinc-100', 'shadow-sm');
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            btn.classList.remove('border-zinc-900', 'dark:border-zinc-100', 'shadow-sm');
            btn.classList.add('border-transparent', 'hover:border-zinc-400/50');
          }
        });
      }

      /**
       * Gestione del tema Chiaro / Scuro (default: Scuro minimale).
       */
      function initTheme() {
        let savedTheme = 'dark';
        try {
          const stored = localStorage.getItem('outfitBuilderTheme');
          if (stored === 'light' || stored === 'dark') {
            savedTheme = stored;
          }
        } catch (err) {
          // Fallback sicuro in ambienti senza localStorage
        }
        applyTheme(savedTheme);
      }

      function applyTheme(theme) {
        const htmlEl = document.documentElement;
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        if (theme === 'dark') {
          htmlEl.classList.add('dark');
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        } else {
          htmlEl.classList.remove('dark');
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        }

        try {
          localStorage.setItem('outfitBuilderTheme', theme);
        } catch (err) {
          // Ignora se localStorage non è accessibile
        }
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(isDark ? 'light' : 'dark');
      }

      /**
       * Collega gli eventi globali (header, modale, tastiera, swipe modale).
       */
      function bindGlobalEvents() {
        shuffleBtn.addEventListener('click', shuffleOutfit);
        themeToggleBtn.addEventListener('click', toggleTheme);
        copyOutfitBtn.addEventListener('click', copyOutfitToClipboard);

        showAllBtn.addEventListener('click', () => {
          state.categories.forEach((_, idx) => toggleHidden(idx, false));
        });

        // Controlli modale
        closeModalBtn.addEventListener('click', closeQuickViewModal);
        quickViewModal.addEventListener('click', (e) => {
          if (e.target === quickViewModal) closeQuickViewModal();
        });

        modalPrevBtn.addEventListener('click', () => {
          if (state.activeModalCatIndex !== null) {
            stepCategory(state.activeModalCatIndex, -1);
          }
        });

        modalNextBtn.addEventListener('click', () => {
          if (state.activeModalCatIndex !== null) {
            stepCategory(state.activeModalCatIndex, 1);
          }
        });

        // Swipe touch dentro l'anteprima della modale
        let modalTouchX = 0;
        let modalTouchY = 0;
        modalPreviewStage.addEventListener(
          'touchstart',
          (e) => {
            if (!e.touches || e.touches.length !== 1) return;
            modalTouchX = e.touches[0].clientX;
            modalTouchY = e.touches[0].clientY;
          },
          { passive: true }
        );

        modalPreviewStage.addEventListener(
          'touchend',
          (e) => {
            if (state.activeModalCatIndex === null || !e.changedTouches || e.changedTouches.length !== 1) return;
            const dx = e.changedTouches[0].clientX - modalTouchX;
            const dy = e.changedTouches[0].clientY - modalTouchY;
            if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy) * 1.15) {
              stepCategory(state.activeModalCatIndex, dx < 0 ? 1 : -1);
            }
          },
          { passive: true }
        );

        // Scorciatoie tastiera quando la modale è aperta
        document.addEventListener('keydown', (e) => {
          if (state.activeModalCatIndex === null) return;
          if (e.key === 'Escape') {
            closeQuickViewModal();
          } else if (e.key === 'ArrowLeft') {
            stepCategory(state.activeModalCatIndex, -1);
          } else if (e.key === 'ArrowRight') {
            stepCategory(state.activeModalCatIndex, 1);
          }
        });
      }

      /**
       * Inizializzazione dell'app al caricamento del DOM.
       */
      function init() {
        initTheme();
        buildSlidersDOM();
        bindGlobalEvents();

        // Carica il primo capo di ogni categoria
        state.categories.forEach((_, idx) => {
          renderCategoryContent(idx);
        });

        renderOutfitSummary();
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
